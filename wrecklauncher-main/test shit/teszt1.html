<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Store – Live Filter (No CSS)</title>
</head>
<body>

<h1>STORE</h1>

<div style="display:flex; gap:40px;">
  <!-- GAME LIST -->
  <div style="flex:1;" id="gameList"></div>

  <!-- FILTERS -->
  <div style="width:250px;">
    <h3>Narrow by price</h3>
    <input id="priceSlider" type="range" min="0" max="100" value="60">
    <div>Under $<span id="priceValue">100</span></div>

    <h3>Narrow by tags</h3>
    <label><input type="checkbox" value="Horror" checked> Horror</label><br>
    <label><input type="checkbox" value="Action" checked> Action</label><br>
    <label><input type="checkbox" value="Puzzle" checked> Puzzle</label><br>
    <label><input type="checkbox" value="Story" checked> Story</label>
  </div>
</div>

<script>
  // TEST GAME DATA
  const games = [
    { title: 'Signalis', price: 19.99, tags: ['Horror', 'Story'] },
    { title: 'Neon Depths', price: 24.99, tags: ['Action'] },
    { title: 'Echo Chamber', price: 9.99, tags: ['Puzzle'] },
    { title: 'Last Light', price: 39.99, tags: ['Horror', 'Action'] },
    { title: 'Paper Mind', price: 14.99, tags: ['Puzzle', 'Story'] },
    { title: 'Void Signal', price: 59.99, tags: ['Action', 'Story'] }
  ];

  const gameList = document.getElementById('gameList');
  const priceSlider = document.getElementById('priceSlider');
  const priceValue = document.getElementById('priceValue');
  const tagCheckboxes = [...document.querySelectorAll('input[type=checkbox]')];

  function render() {
    const maxPrice = Number(priceSlider.value);
    const activeTags = tagCheckboxes.filter(c => c.checked).map(c => c.value);

    priceValue.textContent = maxPrice;
    gameList.innerHTML = '';

    const filteredGames = games.filter(game => {
      const priceOk = game.price <= maxPrice;
      const tagOk = activeTags.length === 0 || game.tags.some(tag => activeTags.includes(tag));
      return priceOk && tagOk;
    });

    if (filteredGames.length === 0) {
      gameList.textContent = 'No games match your filters.';
      return;
    }

    filteredGames.forEach(game => {
      const div = document.createElement('div');
      div.innerHTML = `
        <strong>${game.title}</strong><br>
        Price: $${game.price.toFixed(2)}<br>
        Tags: ${game.tags.join(', ')}
        <hr>
      `;
      gameList.appendChild(div);
    });
  }

  // LIVE UPDATES (NO BUTTONS)
  priceSlider.addEventListener('input', render);
  tagCheckboxes.forEach(cb => cb.addEventListener('change', render));

  render();
</script>

</body>
</html>
